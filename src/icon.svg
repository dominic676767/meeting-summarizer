<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Meeting Summarizer">
  <title>Meeting Summarizer</title>
  <!--
    "The Status Readout" identity: a live-capture status dot (Signal Green,
    the only color — Meaning-Only Color Rule) beside caption lines that
    condense to one short summary line. Ink strokes use context-fill so the
    mark adapts to light/dark Firefox toolbars; the green signal stays fixed.
  -->
  <g fill="context-fill" fill-opacity="context-fill-opacity">
    <rect x="12.5" y="4" width="15.5" height="5" rx="2.5"/>
    <rect x="4" y="13.5" width="24" height="5" rx="2.5"/>
    <rect x="4" y="23" width="13" height="5" rx="2.5"/>
  </g>
  <circle cx="6.5" cy="6.5" r="3.5" fill="#0e8a16"/>
</svg>
