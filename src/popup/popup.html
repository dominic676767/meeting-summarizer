<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Meeting Summarizer</title>
    <style>
      /* An id or class `display` rule outranks the UA sheet's [hidden]
         { display: none }, so hidden elements stay on screen — which had the
         progress bar permanently visible and, worse, kept a stale
         "Recording" badge up after capture stopped. This must come first and
         win, or every future display rule reopens the same bug. */
      [hidden] { display: none !important; }
      body { font: 13px system-ui, sans-serif; margin: 0; min-width: 300px; max-width: 360px; }
      main { padding: 12px; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      #status { margin-bottom: 10px; }
      .capturing { color: #0e8a16; }
      /* The Text-or-Dot Rule (DESIGN.md): red *type* at weight 600 is a warning
         to act on; a red *dot* beside Ink text is the live-recording indicator.
         One colour stays honest across two jobs because the forms differ. The
         dot is a drawn element, never a glyph — no glyph carries state. */
      .warning { color: #d73a4a; font-weight: 600; }
      .recording { color: #1a1a1a; }
      .rec-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #d73a4a; margin-right: 6px; vertical-align: baseline; }
      .idle { color: #555; }
      #detail { color: #555; font-size: 12px; margin: -6px 0 10px; }
      #model-progress { display: block; width: 100%; height: 6px; margin: 0 0 10px; }
      #title { color: #555; font-size: 12px; margin-bottom: 10px; }
      #degraded { color: #555; font-size: 12px; margin: -4px 0 10px; }
      /* Muted supporting text, never Alert Red. A microphone that is off is a
         choice the user made, and one that could not be used is a fact about this
         recording rather than something they can fix mid-meeting — neither is a
         warning to act on, so neither takes red type. */
      #mic { color: #555; font-size: 12px; margin: -4px 0 10px; }
      /* A permission request is not a warning: Ink for the ask, Muted for the
         reason, ordinary buttons for the two answers, and no new colour. */
      #mic-disclosure { border: 1px solid #eee; border-radius: 4px; padding: 8px; margin: 0 0 10px; }
      #mic-ask { font-weight: 600; margin: 0 0 4px; }
      #mic-why { color: #555; font-size: 12px; margin: 0 0 8px; }
      .actions { display: flex; gap: 8px; }
      button { font: inherit; padding: 4px 10px; }
      .held-group { margin-top: 12px; }
      .held-group ul { list-style: none; padding: 0; margin: 6px 0 0; }
      .held-group li { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 4px 0; border-top: 1px solid #eee; }
      /* A meeting title or a provider error can be one unbroken 180-character
         token. Without these it stretched the popup past 1500px and pushed
         Retry off screen — the control you need precisely when it failed. */
      .held-group li > span { min-inline-size: 0; overflow-wrap: anywhere; }
      .held-group li > button { flex: 0 0 auto; }
      .reason { color: #aa0000; font-size: 12px; }
      h2 { font-size: 12px; margin: 0; color: #555; }
      footer { margin-top: 12px; padding-top: 10px; border-top: 1px solid #eee; }
      #hint { color: #555; font-size: 12px; margin: 0 0 8px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Meeting Summarizer</h1>
      <!-- One live region covers the phase name and its measure: a screen
           reader user must hear which of the long phases is running, not just
           that something is busy. -->
      <div id="status-region" role="status" aria-live="polite">
        <div id="status" class="idle">Not in a meeting.</div>
        <div id="detail" hidden></div>
        <progress id="model-progress" max="100" value="0" aria-label="Transcription model download" hidden></progress>
      </div>
      <div id="title"></div>
      <!-- True whether no audio was recorded or its words never arrived: either
           way the summary is caption words, and only that claim is safe here. -->
      <div id="degraded" hidden>Captions only — the summary was not built from recorded audio.</div>
      <!-- What the microphone is doing, in words. Recording state is carried by
           the status line's dot and its text; this line only ever states the
           setting's consequence. -->
      <div id="mic" hidden></div>
      <!-- The disclosure. Recording somebody's microphone is a bigger step than
           recording a tab, and an offscreen document cannot show Chromium's own
           permission prompt, so this is the disclosure — asked once, before the
           microphone is ever opened, and answerable either way. -->
      <div id="mic-disclosure" hidden>
        <p id="mic-ask">Include your microphone?</p>
        <!-- Filled in by popup.ts, because what happens to the audio depends on
             the Transcription Provider the user has selected: the promise that
             earns a yes is only true of the local engine. -->
        <p id="mic-why"></p>
        <div class="actions">
          <!-- "Tab audio only" says what it does. "No thanks" would frame
               declining as a refusal to cooperate, when it is a complete working
               mode. -->
          <button id="mic-on">Include my microphone</button>
          <button id="mic-off">Tab audio only</button>
        </div>
      </div>
      <div class="actions">
        <button id="start" hidden>Start recording</button>
        <button id="stop" hidden>Stop</button>
        <button id="summarize" hidden>Summarize now</button>
        <button id="skip-transcription" hidden>Skip transcription, use captions</button>
      </div>
      <!-- Recordings come first: their retry is the one that can still turn a
           Meeting into an accurate transcript, and a held recording becomes a
           held transcript on its way to a summary, never the other way. -->
      <div id="held-recordings" class="held-group" hidden>
        <h2>Held recordings — audio not transcribed</h2>
        <ul id="held-recording-list"></ul>
      </div>
      <div id="held" class="held-group" hidden>
        <h2>Held transcripts</h2>
        <ul id="held-list"></ul>
      </div>
      <footer>
        <p id="hint" hidden>Set your LLM provider in Settings to get started.</p>
        <button id="open-settings">Settings</button>
      </footer>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
