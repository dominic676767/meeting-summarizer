<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px system-ui, sans-serif; margin: 0; min-width: 300px; }
      main { padding: 12px; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      #status { margin-bottom: 10px; }
      .capturing { color: #0e8a16; }
      .warning { color: #d73a4a; font-weight: 600; }
      .recording { color: #24292e; }
      .idle { color: #555; }
      #title { color: #555; font-size: 12px; margin-bottom: 10px; }
      #degraded { color: #555; font-size: 12px; margin: -4px 0 10px; }
      .actions { display: flex; gap: 8px; }
      button { font: inherit; padding: 4px 10px; }
      #held { margin-top: 12px; }
      #held ul { list-style: none; padding: 0; margin: 6px 0 0; }
      #held li { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 4px 0; border-top: 1px solid #eee; }
      .reason { color: #aa0000; font-size: 12px; }
      h2 { font-size: 12px; margin: 0; color: #555; }
      footer { margin-top: 12px; padding-top: 10px; border-top: 1px solid #eee; }
      #hint { color: #555; font-size: 12px; margin: 0 0 8px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Meeting Summarizer</h1>
      <div id="status" class="idle" role="status" aria-live="polite">Not in a meeting.</div>
      <div id="title"></div>
      <div id="degraded" hidden>Captions only — no audio was recorded.</div>
      <div class="actions">
        <button id="start" hidden>Start recording</button>
        <button id="stop" hidden>Stop</button>
        <button id="summarize" hidden>Summarize now</button>
      </div>
      <div id="held" hidden>
        <h2>Held transcripts</h2>
        <ul id="held-list"></ul>
      </div>
      <footer>
        <p id="hint" hidden>Set your LLM provider in Settings to get started.</p>
        <button id="open-settings">Settings</button>
      </footer>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
