<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Meeting Summarizer">
  <title>Meeting Summarizer</title>
  <!--
    "The Bullet" mark: one line of summary, and the dot that leads it is the
    live-capture signal (Signal Green, the only color — One Signal Rule).
    The Ink tile carries the mark on light and dark toolbars alike; Chromium
    has no context-fill. Source for the PNGs — see scripts/render-icons.mjs.
  -->
  <rect width="32" height="32" rx="7" fill="#1a1a1a"/>
  <circle cx="9.5" cy="16" r="4.5" fill="#0e8a16"/>
  <rect x="16" y="14" width="10" height="4" fill="#ffffff"/>
</svg>
